name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host hetzner
            HostName $HETZNER_HOST
            User ${HETZNER_USER:-root}
            Port ${HETZNER_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync WordPress Theme & AdSense Verification to Hetzner
        run: |
          ssh hetzner "mkdir -p /var/www/unitedbeats/wp-content/themes/unitedbeats"
          scp -r wordpress-theme/unitedbeats/* hetzner:/var/www/unitedbeats/wp-content/themes/unitedbeats/
          scp ads.txt hetzner:/var/www/unitedbeats/ads.txt
          ssh hetzner "chown -R www-data:www-data /var/www/unitedbeats/wp-content/themes/unitedbeats /var/www/unitedbeats/ads.txt && find /var/www/unitedbeats/wp-content/themes/unitedbeats -type d -exec chmod 755 {} + && find /var/www/unitedbeats/wp-content/themes/unitedbeats -type f -exec chmod 644 {} +"

      - name: Lint Theme PHP, Purge FastCGI Microcache & Reload Nginx
        run: |
          ssh hetzner 'for f in /var/www/unitedbeats/wp-content/themes/unitedbeats/*.php; do php -l "$f"; done && rm -rf /var/cache/nginx/unitedbeats/* && nginx -t && systemctl reload nginx'
