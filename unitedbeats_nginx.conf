server {
    server_name unitedbeats.org www.unitedbeats.org unitedbeats.net www.unitedbeats.net unitedbeats.site www.unitedbeats.site;
    root /var/www/unitedbeats;
    index index.php index.html;
    client_max_body_size 10m;

    set $skip_ub_cache 0;
    if ($request_method = POST) {
        set $skip_ub_cache 1;
    }
    if ($query_string != "") {
        set $skip_ub_cache 1;
    }
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|^/feed/*|/tag/.*/feed/*|index.php|/.*sitemap.*\.(xml|xsl)|^/wp-json/") {
        set $skip_ub_cache 1;
    }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_ub_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-unitedbeats.sock;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_cache UNITEDBEATS;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 301 302 60s;
        fastcgi_cache_bypass $skip_ub_cache;
        fastcgi_no_cache $skip_ub_cache;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_lock on;
        add_header X-UB-Cache $upstream_cache_status always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/unitedbeats.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/unitedbeats.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.unitedbeats.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = unitedbeats.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.unitedbeats.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = unitedbeats.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.unitedbeats.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = unitedbeats.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name unitedbeats.org www.unitedbeats.org unitedbeats.net www.unitedbeats.net unitedbeats.site www.unitedbeats.site;
    return 404; # managed by Certbot
}
